name: Validate StormLens V12

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-v12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check V12 JavaScript syntax
        run: |
          node --check premium-details-v12.js
          node --check timeline-history-v12.js
          node --check radar-fix.js
          node --check weather-runtime-v11.js
          node --check app-polish-v10.js
      - name: Build production output
        env:
          MAPTILER_API_KEY: ci_test_maptiler_key
        run: |
          npm run build
          test -f dist/premium-details-v12.js
          test -f dist/premium-details-v12.css
          test -f dist/timeline-history-v12.js
          test -f dist/timeline-history-v12.css
          grep -q "premium-details-v12.js" dist/radar-fix.js
          grep -q "timeline-history-v12.js" dist/radar-fix.js
          grep -q "Government alerts" dist/premium-details-v12.js
          grep -q "Sun & daylight" dist/premium-details-v12.js
