name: Validate StormLens

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser JavaScript syntax
        run: |
          node --check app.js
          node --check app-polish-v10.js
          node --check radar-fix.js
          node --check map-core-v10.js
          node --check map-v10-bridge.js
          node --check location-accuracy-v10.js
          node --check storm-composite-v10.js
          node --check sw.js
          node --check build.mjs
          node --check build-post-v10.mjs
          node --check scripts/check-geomet.mjs
          node --check scripts/check-geomet-render.mjs
          node --check scripts/smoke-map-layers.mjs
          node --check scripts/smoke-public-services.mjs
      - name: Check Vercel API module syntax
        run: |
          for file in api/*.js; do
            node --input-type=module --check < "$file"
          done
      - name: Validate JSON files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
      - name: Test V10.4 production build
        env:
          MAPTILER_API_KEY: ci_test_maptiler_key
        run: |
          npm run build
          test -f dist/index.html
          test -f dist/app-polish-v10.js
          test -f dist/map-core-v10.js
          test -f dist/map-core-v10.css
          test -f dist/map-polish-v10.css
          test -f dist/map-v10-bridge.js
          test -f dist/location-accuracy-v10.js
          test -f dist/storm-composite-v10.js
          test -f dist/maptiler-env.js
          grep -q "ci_test_maptiler_key" dist/maptiler-env.js
          grep -q "maximum-scale=1" dist/index.html
          grep -q "user-scalable=no" dist/index.html
          grep -q ">Next 6h<" dist/index.html
          grep -q ">Storm<" dist/index.html
          grep -q "getBestDevicePosition" dist/app.js
          grep -q "maximumAge:0" dist/app.js
          grep -q "City, address or place" dist/app-polish-v10.js
          grep -q "saved-location-remove" dist/app-polish-v10.js
          grep -q "document.dispatchEvent(new CustomEvent('stormlens:map-screen-visible'))" dist/app.js
          grep -q "document.addEventListener('stormlens:map-screen-visible'" dist/map-core-v10.js
          grep -q "StormLensMapV10" dist/map-core-v10.js
          grep -q "stormlens-user-location-dot" dist/map-core-v10.js
          grep -q "Radar forecast" dist/map-core-v10.js
          grep -q "title:'Short-range radar'.*provider:'maptiler'" dist/map-core-v10.js
          grep -q "title:'Official radar nowcast'.*provider:'eccc'" dist/map-core-v10.js
          grep -q "title:'Storm'.*provider:'maptiler'" dist/map-core-v10.js
          grep -q "if(key==='lightning')return'lightning'" dist/map-core-v10.js
          grep -q "if(key==='storms')return'storm'" dist/map-core-v10.js
          grep -q "slider.addEventListener('change'" dist/map-core-v10.js
          grep -q "bufferRaster(2)" dist/map-core-v10.js
          grep -q "new maptilerweather.ColorRamp" dist/map-core-v10.js
          grep -q "id!='showalter'" dist/map-core-v10.js
          grep -q "HRDPS-WEonG_2.5km_Thunderstorm-Prob" dist/map-core-v10.js
          grep -q "stormlens-location-accuracy-source" dist/location-accuracy-v10.js
          grep -q "stormlens-storm-lightning-density" dist/storm-composite-v10.js
          grep -q "navigator.vibrate" dist/storm-composite-v10.js
          if grep -q "FORECAST · SMOOTH" dist/map-core-v10.js; then echo "Smooth label still present"; exit 1; fi
          if grep -q "window.dispatchEvent(new CustomEvent('stormlens:map-screen-visible'))" dist/app.js; then echo "V10 map-visible event emitted on wrong target"; exit 1; fi
          if grep -q "unpkg.com/leaflet" dist/index.html; then echo "Leaflet still present in production index"; exit 1; fi
          if grep -q "initMap();" dist/app.js; then echo "Legacy map startup still present in production app"; exit 1; fi
          if grep -q "L\.map(" dist/app.js; then echo "Legacy Leaflet map API still present in production app"; exit 1; fi
          grep -q "function geometryContainsPoint" dist/app.js
          if grep -q "tomorrowReady?'lightningForecast':'lightning'" dist/map-core-v10.js; then echo "Broken Tomorrow lightning quick target still present"; exit 1; fi
      - name: Validate live ECCC GeoMet layers
        continue-on-error: true
        run: node scripts/check-geomet.mjs
      - name: Render all ECCC map products used in V10
        continue-on-error: true
        run: node scripts/smoke-map-layers.mjs
      - name: Smoke public weather services
        continue-on-error: true
        run: node scripts/smoke-public-services.mjs
