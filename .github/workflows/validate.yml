name: Validate StormLens

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser JavaScript syntax
        run: |
          node --check app.js
          node --check radar-fix.js
          node --check map-core-v10.js
          node --check map-v10-bridge.js
          node --check premium-home.js
          node --check sw.js
          node --check build.mjs
          node --check scripts/check-geomet.mjs
          node --check scripts/check-geomet-render.mjs
      - name: Check Vercel API module syntax
        run: |
          for file in api/*.js; do
            node --input-type=module --check < "$file"
          done
      - name: Validate JSON files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
      - name: Test V10 production build
        env:
          MAPTILER_API_KEY: ci_test_maptiler_key
        run: |
          npm run build
          test -f dist/index.html
          test -f dist/map-core-v10.js
          test -f dist/map-core-v10.css
          test -f dist/map-v10-bridge.js
          test -f dist/maptiler-env.js
          grep -q "ci_test_maptiler_key" dist/maptiler-env.js
          grep -q "maximum-scale=1" dist/index.html
          grep -q "user-scalable=no" dist/index.html
          grep -q "stormlens:map-screen-visible" dist/app.js
          grep -q "StormLensMapV10" dist/map-core-v10.js
          grep -q "stormlens-user-location-dot" dist/map-core-v10.js
          grep -q "Radar forecast" dist/map-core-v10.js
          grep -q "Thunderstorms · 14d" dist/map-core-v10.js
          if grep -q "unpkg.com/leaflet" dist/index.html; then echo "Leaflet still present in production index"; exit 1; fi
          if grep -q "initMap();" dist/app.js; then echo "Legacy map startup still present in production app"; exit 1; fi
      - name: Validate live ECCC GeoMet layers
        continue-on-error: true
        run: node scripts/check-geomet.mjs
      - name: Render key Calgary GeoMet products
        continue-on-error: true
        run: node scripts/check-geomet-render.mjs
