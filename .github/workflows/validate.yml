name: Validate StormLens

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser JavaScript syntax
        run: |
          node --check app.js
          node --check radar-fix.js
          node --check map-v6.js
          node --check map-v6-guard.js
          node --check premium-bridge.js
          node --check premium-home.js
          node --check premium-lightning.js
          node --check sw.js
          node --check scripts/check-geomet.mjs
          node --check scripts/check-geomet-render.mjs
      - name: Check Vercel API module syntax
        run: |
          for file in api/*.js; do
            node --input-type=module --check < "$file"
          done
      - name: Validate JSON files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"
      - name: Validate live ECCC GeoMet layers
        run: node scripts/check-geomet.mjs
      - name: Render key Calgary GeoMet products
        run: node scripts/check-geomet-render.mjs
